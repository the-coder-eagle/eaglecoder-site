name: 代码质量检查

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 检查、测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装锁定依赖
        run: npm ci

      - name: 阻断严重依赖漏洞
        run: npm run audit:critical

      - name: 执行完整验证
        run: npm run verify
